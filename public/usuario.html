<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel Usuario</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="contenedor">
    <img src="logo-dinex.png" alt="Logo DinEX" class="logo">
    <h1>Panel del Usuario</h1>

    <!-- Timer de inactividad visible -->
    <div id="inactivity-bar-wrap">
      <div id="inactivity-bar"></div>
    </div>
    <span id="inactivity-label">Sesión activa</span>

    <!-- Instrucción del próximo paso -->
    <p id="orden-instruccion">Próximo marcaje: <strong id="next-action-label">Cargando…</strong></p>

    <div class="botones">
      <button id="btn-entrada"       onclick="registrar('entrada')"       class="boton" disabled>Entrada</button>
      <button id="btn-salida_lunch"  onclick="registrar('salida_lunch')"  class="boton" disabled>Lunch Out</button>
      <button id="btn-entrada_lunch" onclick="registrar('entrada_lunch')" class="boton" disabled>Lunch In</button>
      <button id="btn-salida"        onclick="registrar('salida')"        class="boton" disabled>Salida</button>
      <button onclick="cerrarSesion()" class="boton danger">Cerrar Sesión</button>
    </div>

    <p id="mensaje" style="margin-top: 20px;"></p>
  </div>

  <script src="common.js"></script>

  <script>
    // ── Geolocalización ──────────────────────────────────────────────────────
    const GEO_OPTS = { enableHighAccuracy: false, timeout: 8000, maximumAge: 0 };

    function getCoords() {
      return new Promise((resolve, reject) => {
        if (!("geolocation" in navigator))
          return reject(new Error("Tu navegador no soporta geolocalización."));
        navigator.geolocation.getCurrentPosition(
          pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }),
          err => {
            if (err.code === 1) reject(new Error("Debes permitir el acceso a tu ubicación para marcar."));
            else if (err.code === 2) reject(new Error("Ubicación no disponible. Revisa conexión/GPS."));
            else reject(new Error("La solicitud de ubicación tardó demasiado. Intenta nuevamente."));
          },
          GEO_OPTS
        );
      });
    }

    // ── Lógica de orden de botones ───────────────────────────────────────────
    let marcadosHoy = new Set();

    function actualizarBotones() {
      const tieneEntrada      = marcadosHoy.has('entrada');
      const tieneSalidaLunch  = marcadosHoy.has('salida_lunch');
      const tieneEntradaLunch = marcadosHoy.has('entrada_lunch');
      const tieneSalida       = marcadosHoy.has('salida');

      if (tieneSalida) {
        ['entrada','salida_lunch','entrada_lunch','salida'].forEach(t =>
          document.getElementById('btn-' + t).disabled = true
        );
        document.getElementById('next-action-label').textContent = 'Turno completado ✅';
        document.getElementById('orden-instruccion').style.color = '#84a900';
        return;
      }

      // entrada: solo si NO la ha marcado
      document.getElementById('btn-entrada').disabled = tieneEntrada;

      // salida_lunch: solo si ya marcó entrada y NO tiene salida_lunch
      document.getElementById('btn-salida_lunch').disabled = !(tieneEntrada && !tieneSalidaLunch);

      // entrada_lunch: solo si ya marcó salida_lunch y NO tiene entrada_lunch
      document.getElementById('btn-entrada_lunch').disabled = !(tieneSalidaLunch && !tieneEntradaLunch);

      // salida: si tiene entrada Y (no tocó lunch O completó lunch)
      const lunchCompleto = tieneSalidaLunch && tieneEntradaLunch;
      const sinLunch      = !tieneSalidaLunch;
      document.getElementById('btn-salida').disabled = !(tieneEntrada && (sinLunch || lunchCompleto));

      // Etiqueta orientativa
      let lbl = '';
      if (!tieneEntrada)          lbl = 'Entrada';
      else if (!tieneSalidaLunch) lbl = 'Lunch Out  ó  Salida';
      else if (!tieneEntradaLunch)lbl = 'Lunch In';
      else                        lbl = 'Salida';
      document.getElementById('next-action-label').textContent = lbl;
    }

    async function cargarEstadoHoy() {
      const usuario = sessionStorage.getItem('usuario');
      if (!usuario) { actualizarBotones(); return; }
      try {
        // Obtener fecha de hoy en formato YYYY-MM-DD del servidor (CST)
        const resp = await fetch('/api/reporte?usuario=' + encodeURIComponent(usuario));
        const registros = await resp.json();
        // Calcular fecha de hoy en CST
        const hoyCST = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Chicago' });
        registros.forEach(r => { if (r.fecha === hoyCST) marcadosHoy.add(r.tipo); });
      } catch (e) { console.warn('No se pudo cargar estado hoy:', e.message); }
      actualizarBotones();
    }

    // ── Marcaje ──────────────────────────────────────────────────────────────
    function bloquearBotones() {
      ['entrada','salida_lunch','entrada_lunch','salida'].forEach(t =>
        document.getElementById('btn-' + t).disabled = true
      );
    }

    async function registrar(tipo) {
      const mensajeEl   = document.getElementById('mensaje');
      const usuario      = sessionStorage.getItem('usuario');
      const departamento = sessionStorage.getItem('departamento');

      if (!usuario) {
        alert('Sesión expirada. Vuelve a iniciar sesión.');
        window.location.href = 'usuario-login.html';
        return;
      }

      try {
        bloquearBotones();
        mensajeEl.style.color = '#333';
        mensajeEl.textContent = 'Obteniendo ubicación…';

        const location = await getCoords();
        mensajeEl.textContent = 'Registrando marcaje…';

        const data = await postJSON('/api/marcar', { usuario, tipo, departamento, location });

        if (!data || data.success === false)
          throw new Error((data && data.mensaje) || 'No se pudo registrar el marcaje.');

        marcadosHoy.add(tipo);
        mensajeEl.style.color = 'green';
        mensajeEl.textContent = data.mensaje || 'Marcaje registrado correctamente.';
      } catch (e) {
        console.error(e);
        mensajeEl.style.color = 'red';
        mensajeEl.textContent = e.message || 'Error al registrar el marcaje.';
      } finally {
        actualizarBotones();
      }
    }

    // ── Timer de inactividad con barra visual (15 min) ────────────────────────
    const TIMEOUT_MS = 15 * 60 * 1000;
    const WARNING_MS =  2 * 60 * 1000;
    let timerID, startTime, rafID;
    const bar   = document.getElementById('inactivity-bar');
    const label = document.getElementById('inactivity-label');

    function animarBarra() {
      const elapsed = Date.now() - startTime;
      const pct     = Math.min(elapsed / TIMEOUT_MS, 1);
      const restMs  = Math.max(TIMEOUT_MS - elapsed, 0);
      const restMin = Math.floor(restMs / 60000);
      const restSec = Math.floor((restMs % 60000) / 1000);
      bar.style.width = (100 - pct * 100).toFixed(1) + '%';
      if (restMs <= WARNING_MS) {
        bar.style.background = '#ea1902';
        label.style.color    = '#ea1902';
        label.textContent    = `⚠️ Sesión cierra en ${restMin}:${String(restSec).padStart(2,'0')} min`;
      } else {
        bar.style.background = '#84a900';
        label.style.color    = '#666';
        label.textContent    = `Sesión activa — cierra en ${restMin}:${String(restSec).padStart(2,'0')} min`;
      }
      if (pct < 1) rafID = requestAnimationFrame(animarBarra);
    }

    function reiniciarTemporizador() {
      clearTimeout(timerID);
      cancelAnimationFrame(rafID);
      startTime = Date.now();
      animarBarra();
      timerID = setTimeout(() => {
        alert('Sesión cerrada por inactividad (15 minutos sin actividad).');
        sessionStorage.clear();
        window.location.href = 'usuario-login.html';
      }, TIMEOUT_MS);
    }

    ['click','mousemove','keypress','scroll','touchstart'].forEach(evt =>
      document.addEventListener(evt, reiniciarTemporizador)
    );
    reiniciarTemporizador();
    cargarEstadoHoy();
  </script>

  <style>
    .boton.danger { background: #ea1902; }
    .botones { text-align: center; margin: 20px 0; }
    .boton {
      background-color: #ec008c; color: white; border: none;
      padding: 8px 16px; margin: 5px; border-radius: 5px; cursor: pointer;
      transition: background 0.3s ease, opacity 0.2s;
    }
    .boton:disabled { opacity: 0.35; cursor: not-allowed; }
    .boton:not(:disabled):hover { background-color: #c60074; }
    h1 { text-align: center; margin-bottom: 10px; color: #85b200; }
    .contenedor { max-width: 1100px; margin: auto; padding: 20px; }
    .logo { display: block; margin: 0 auto 10px auto; max-width: 220px; }

    #orden-instruccion {
      text-align: center; color: #555; font-size: 14px; margin: 6px 0 4px;
    }

    /* Barra de inactividad */
    #inactivity-bar-wrap {
      max-width: 440px; margin: 10px auto 0;
      background: #e0e0e0; border-radius: 8px; height: 10px; overflow: hidden;
    }
    #inactivity-bar {
      height: 100%; width: 100%; background: #84a900; border-radius: 8px;
    }
    #inactivity-label {
      display: block; text-align: center; font-size: 11px;
      color: #666; margin: 3px auto 0;
    }
  </style>
</body>
</html>
