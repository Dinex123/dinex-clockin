<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reporte de Horas</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <style>
    .boton {
      background-color: #ec008c;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    .boton:hover { background-color: #c60074; }

    .tabla-reporte {
      width: 90%;
      margin: 30px auto;
      border-collapse: collapse;
      font-size: 15px;
      text-align: center;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.1);
    }
    .tabla-reporte th {
      background-color: #ec008c;
      color: white;
      padding: 10px;
      font-weight: bold;
    }
    .tabla-reporte td {
      padding: 8px;
      border-bottom: 1px solid #ddd;
    }
    .tabla-reporte tr:nth-child(even) { background-color: #fdf4fb; }
    .tabla-reporte tr:hover { background-color: #fae6f4; }

    .contenedor { max-width: 1100px; margin: auto; padding: 20px; }
    .logo { display: block; margin: 0 auto 10px auto; max-width: 220px; }
    h1 { text-align: center; margin-bottom: 20px; color: #88a800; }

    input[type="text"] {
      padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px;
      font-size: 14px; margin-right: 10px;
    }
    #mensaje-reporte {
      text-align: center; font-weight: bold; color: red; margin-top: 10px;
    }

    /* 🔴 Resaltado para fuera de geocerca */
    .fuera-geo { background: #ffe6e6; }
    .fuera-geo:hover { background: #ffd6d6; }

    .resumen-geo {
      width: 90%; margin: 10px auto 0 auto;
      display: flex; gap: 10px; align-items: center; justify-content: flex-start; font-size: 14px;
    }
    .chip {
      display: inline-block; padding: 6px 10px; border-radius: 999px; font-weight: 600;
      border: 1px solid transparent;
    }
    .chip.ok { background: #e7f7e7; color: #167c16; border-color: #bfe6bf; }
    .chip.warn { background: #ffe6e6; color: #b01919; border-color: #ffc2c2; }
    .chip.neutral { background: #eef2f7; color: #3c4758; border-color: #d8dee6; }
  </style>
</head>
<body>
  <script>
    // Guard de sesión admin - redirige si no hay credenciales
    (function() {
      if (!sessionStorage.getItem('adminUser')) {
        window.location.replace('admin-login.html');
      }
    })();
  </script>

  <div class="contenedor">
    <img src="logo-dinex.png" alt="Logo DinEX" class="logo">
    <h1>Reporte de Horas por Empleado</h1>

    <div style="margin-bottom:16px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center;">
      <div style="position:relative;">
        <input type="text" id="usuarioBusca" placeholder="Buscar por nombre o usuario..."
          autocomplete="off"
          style="padding:8px 12px; font-size:14px; width:260px; border:1px solid #ccc; border-radius:6px;"
          oninput="filtrarEmpleados()" onkeydown="teclaEmpleados(event)">
        <ul id="listaEmpleados" style="display:none; position:absolute; left:0; right:0; top:100%;
          background:#fff; border:1px solid #ccc; border-top:none; border-radius:0 0 6px 6px;
          margin:0; padding:0; list-style:none; z-index:100; max-height:220px; overflow-y:auto;
          box-shadow:0 4px 10px rgba(0,0,0,.12); text-align:left;"></ul>
      </div>
      <input type="hidden" id="usuario">
      <button onclick="cargarReporte()" class="boton">Ver Reporte</button>
      <button onclick="exportarExcel()" class="boton">Exportar a Excel</button>
      <button onclick="exportarPDF()" class="boton">Exportar a PDF</button>
    </div>
    <div id="empleadoSeleccionado" style="text-align:center; font-size:13px; color:#666; margin-bottom:4px; min-height:18px;"></div>

    <p id="mensaje-reporte"></p>

    <div id="resultado" style="margin-top: 20px;"></div>
    <br>
    <a href="admin.html" class="boton">Volver al Panel</a>
  </div>

  <script>
    let datosGlobal = [];
    let totalHorasStr = '';
    let empleadosActivos = [];

    // Cargar empleados activos al abrir la página
    async function cargarEmpleadosActivos() {
      try {
        const res = await fetch('/api/empleados');
        empleadosActivos = await res.json();
      } catch(e) { console.error('Error cargando empleados:', e); }
    }
    cargarEmpleadosActivos();

    function filtrarEmpleados() {
      const q = document.getElementById('usuarioBusca').value.toLowerCase().trim();
      const ul = document.getElementById('listaEmpleados');
      ul.innerHTML = '';
      document.getElementById('usuario').value = '';
      document.getElementById('empleadoSeleccionado').textContent = '';

      if (!q) { ul.style.display = 'none'; return; }
      const matches = empleadosActivos.filter(u =>
        u.usuario.toLowerCase().includes(q) ||
        (u.nombre || '').toLowerCase().includes(q)
      ).slice(0, 10);

      if (!matches.length) { ul.style.display = 'none'; return; }
      matches.forEach(u => {
        const li = document.createElement('li');
        li.style.cssText = 'padding:9px 14px; cursor:pointer; font-size:13px; border-bottom:1px solid #f0f0f0;';
        li.innerHTML = `<strong style="font-size:13px;">${u.nombre || u.usuario}</strong> <span style="color:#999; font-size:12px;">(${u.usuario}) — ${u.departamento || ''}</span>`;
        li.onmouseenter = () => li.style.background = '#f7f7f7';
        li.onmouseleave = () => li.style.background = '';
        li.onclick = () => seleccionarEmpleado(u);
        ul.appendChild(li);
      });
      ul.style.display = 'block';
    }

    function seleccionarEmpleado(u) {
      document.getElementById('usuarioBusca').value = u.nombre || u.usuario;
      document.getElementById('usuario').value = u.usuario;
      document.getElementById('listaEmpleados').style.display = 'none';
      document.getElementById('empleadoSeleccionado').textContent =
        `Empleado seleccionado: ${u.nombre || u.usuario} — ${u.departamento || ''}`;
      cargarReporte();
    }

    function teclaEmpleados(e) {
      const ul = document.getElementById('listaEmpleados');
      const items = ul.querySelectorAll('li');
      const activo = ul.querySelector('li.sel');
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        const next = activo ? activo.nextElementSibling : items[0];
        if (activo) { activo.classList.remove('sel'); activo.style.background = ''; }
        if (next) { next.classList.add('sel'); next.style.background = '#e8f5e9'; }
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        const prev = activo ? activo.previousElementSibling : items[items.length-1];
        if (activo) { activo.classList.remove('sel'); activo.style.background = ''; }
        if (prev) { prev.classList.add('sel'); prev.style.background = '#e8f5e9'; }
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (activo) activo.click();
        else if (document.getElementById('usuario').value) cargarReporte();
      } else if (e.key === 'Escape') {
        ul.style.display = 'none';
      }
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#usuarioBusca') && !e.target.closest('#listaEmpleados')) {
        document.getElementById('listaEmpleados').style.display = 'none';
      }
    });

    function fmtFecha(iso) {
      if (!iso || !iso.includes('-')) return '';
      const [y, m, d] = iso.split('-');
      return `${m}/${d}/${y}`;
    }

    async function cargarReporte() {
      const usuario = (document.getElementById("usuario").value || document.getElementById("usuarioBusca").value).trim();
      const mensaje = document.getElementById("mensaje-reporte");
      const cont = document.getElementById("resultado");

      mensaje.textContent = "";
      cont.innerHTML = "";

      if (!usuario) {
        mensaje.textContent = "⚠️ Ingresa un usuario válido.";
        return;
      }

      const res = await fetch("/api/reporte?usuario=" + encodeURIComponent(usuario));
      const raw = await res.json().catch(() => []);

      if (!raw.length) {
        mensaje.textContent = "❌ No se encontraron registros para este usuario.";
        return;
      }

      const data = raw.sort((a, b) => {
        if (a.fecha !== b.fecha) return (a.fecha || '').localeCompare(b.fecha || '');
        return (a.hora || '').localeCompare(b.hora || '');
      });

      datosGlobal = data;

      // —— Resumen geocerca
      const dentro = data.filter(r => r.insideGeofence === true).length;
      const fuera  = data.filter(r => r.insideGeofence === false).length;
      const sinDato = data.filter(r => r.insideGeofence !== true && r.insideGeofence !== false).length;

      const resumen = `
        <div class="resumen-geo">
          <span class="chip ok">✔ Dentro de rango: ${dentro}</span>
          <span class="chip warn">⚠ Fuera de rango: ${fuera}</span>
          ${sinDato ? `<span class="chip neutral">Sin dato: ${sinDato}</span>` : ``}
        </div>
      `;

      // —— Tabla
      let tabla = `
        <table class="tabla-reporte">
          <tr>
            <th>Acción</th>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Departamento</th>
            <th>Geocerca</th>
          </tr>
      `;

      data.forEach(r => {
        const esAutomatica = r.tipo === "salida" && r.auto === true;
        const tipoTexto = esAutomatica ? "salida (automática)" : (r.tipo || '');
        const estadoGeo =
          r.insideGeofence === true ? 'Dentro de rango' :
          r.insideGeofence === false ? 'Fuera de rango' : '-';

        tabla += `
          <tr class="${r.insideGeofence === false ? 'fuera-geo' : ''}">
            <td>${tipoTexto}</td>
            <td>${fmtFecha(r.fecha)}</td>
            <td>${r.hora || ''}</td>
            <td>${r.departamento || ''}</td>
            <td>${estadoGeo}</td>
          </tr>
        `;
      });

      tabla += `</table><br>`;

      // —— Total de horas por días (entrada más temprana a salida más tardía)
      const porDia = data.reduce((acc, r) => {
        if (!r.fecha) return acc;
        acc[r.fecha] = acc[r.fecha] || [];
        acc[r.fecha].push(r);
        return acc;
      }, {});

      let totalMs = 0;
      Object.entries(porDia).forEach(([fecha, regs]) => {
        const entradas = regs.filter(x => x.tipo === 'entrada').sort((a,b) => (a.hora || '').localeCompare(b.hora || ''));
        const salidas  = regs.filter(x => x.tipo === 'salida').sort((a,b) => (a.hora || '').localeCompare(b.hora || ''));
        if (entradas.length && salidas.length) {
          const inicio = new Date(`${fecha}T${entradas[0].hora}`);
          const fin    = new Date(`${fecha}T${salidas[salidas.length-1].hora}`);
          if (!isNaN(inicio) && !isNaN(fin) && fin > inicio) {
            totalMs += (fin - inicio);
          }
        }
      });

      const horas   = Math.floor(totalMs / 3600000);
      const minutos = Math.floor((totalMs % 3600000) / 60000);
      totalHorasStr = `${horas}h ${minutos}m`;

      const totalHTML = `<p style="text-align:center; font-weight:bold;">Total de horas trabajadas: ${totalHorasStr}</p>`;

      cont.innerHTML = resumen + tabla + totalHTML;
    }

    function exportarExcel() {
      if (!datosGlobal.length) {
        alert("Primero debe cargar un reporte.");
        return;
      }
      const rows = datosGlobal.map(d => {
        const tipoTexto = d.tipo === "salida" && d.auto === true ? "salida (automática)" : (d.tipo || '');
        const estadoGeo =
          d.insideGeofence === true ? 'Dentro de rango' :
          d.insideGeofence === false ? 'Fuera de rango' : '-';
        return {
          "Acción"       : tipoTexto,
          "Fecha"        : fmtFecha(d.fecha),
          "Hora"         : d.hora || '',
          "Departamento" : d.departamento || '',
          "Geocerca"     : estadoGeo
        };
      });
      rows.push({});
      rows.push({ "Acción": "Total horas", "Hora": totalHorasStr });

      const ws = XLSX.utils.json_to_sheet(rows, { skipHeader: false });
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Reporte");
      ws['!cols'] = [{wpx:120},{wpx:90},{wpx:80},{wpx:130},{wpx:130}];
      XLSX.writeFile(wb, "reporte-usuario.xlsx");
    }

    async function exportarPDF() {
      if (!datosGlobal.length) {
        alert("Primero debe cargar un reporte.");
        return;
      }
      const usuario = document.getElementById("usuario").value.trim();

      const usuariosRes = await fetch("/api/usuarios");
      const mapaNombres = await usuariosRes.json().catch(() => ({}));
      const nombreCompleto = mapaNombres[usuario] || usuario;

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      const img = new Image();
      img.src = 'logo-dinex.png';

      img.onload = () => {
        doc.addImage(img, 'PNG', 14, 8, 50, 15);
        doc.setFontSize(12);
        doc.setTextColor(100);
        doc.text(`Empleado: ${nombreCompleto}`, 70, 20);
        doc.setFontSize(14);
        doc.setTextColor(0);
        doc.text("Reporte de Horas por Empleado", 70, 28);

        const cols = ["Acción", "Fecha", "Hora", "Departamento", "Geocerca"];
        const filas = datosGlobal.map(d => {
          const tipoTexto = d.tipo === "salida" && d.auto === true ? "salida (automática)" : (d.tipo || '');
          const estadoGeo =
            d.insideGeofence === true ? 'Dentro de rango' :
            d.insideGeofence === false ? 'Fuera de rango' : '-';
          return [tipoTexto, fmtFecha(d.fecha), d.hora || '', d.departamento || '', estadoGeo];
        });
        filas.push(['','','','','']);
        filas.push(['Total horas','', totalHorasStr,'','']);

        doc.autoTable({
          startY: 35,
          head: [cols],
          body: filas,
          styles: { fontSize: 10 },
          headStyles: { fillColor: [236, 0, 140] }
        });

        doc.save("reporte-usuario.pdf");
      };
    }
    // Si viene usuario en la URL, cargarlo automáticamente
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const u = params.get('usuario');
      if (u) {
        document.getElementById('usuario').value = u;
        document.getElementById('usuarioBusca').value = u;
        cargarReporte();
      }
    });
  </script>
  <script src="common.js"></script>
</body>
</html>
