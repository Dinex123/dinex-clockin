<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Corregir Horas</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .contenedor { max-width: 1100px; margin: 0 auto; padding: 20px; }
    .boton {
      display: inline-block; padding: 8px 16px; font-size: 14px;
      text-align: center; border: none; border-radius: 6px;
      cursor: pointer; background: #e6007e; color: #fff;
      min-width: 100px; margin: 4px; text-decoration: none;
    }
    .boton.verde { background: #84ae05; }
    .boton.danger { background: #ea1902; }
    .boton.gris { background: #888; }
    .boton:hover { opacity: 0.85; }

    /* Tabs */
    .tabs { display: flex; gap: 8px; margin-bottom: 24px; justify-content: center; flex-wrap: wrap; }
    .tab {
      padding: 10px 24px; font-size: 15px; font-weight: bold;
      border: 2px solid #e6007e; border-radius: 8px; cursor: pointer;
      background: #fff; color: #e6007e; transition: all 0.2s;
    }
